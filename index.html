<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Stampe 3D Protetto</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --accent-hover: #2563eb;
            --text: #f8fafc; --subtext: #94a3b8; --border: #334155; --success: #10b981;
            --warning: #f59e0b; --danger: #ef4444; --whatsapp: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; color: var(--accent); }
        
        /* Schermata di Login */
        #loginScreen {
            max-width: 400px; margin: 100px auto; background: var(--card); padding: 30px;
            border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        #loginScreen h2 { margin-bottom: 20px; color: var(--text); }
        
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: #ffffff; color: #333; font-weight: 600; width: 100%; padding: 12px;
            border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; font-size: 1rem;
        }
        .btn-google:hover { background: #f1f5f9; }

        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 320px 1fr; } }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .card h2 { font-size: 1.2rem; margin-bottom: 16px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--subtext); margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.95rem; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--accent-hover); }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 14px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
        .stat-box .val { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
        .stat-box .lbl { font-size: 0.75rem; color: var(--subtext); }
        
        .filters { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { background: var(--border); color: var(--text); border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; width: auto; }
        .filter-btn.active { background: var(--accent); font-weight: bold; }

        .search-box { margin-bottom: 12px; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); }
        th { background: #0f172a; color: var(--subtext); font-weight: 600; }
        
        .actions-cell { display: flex; gap: 6px; align-items: center; }
        .btn-action { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; padding: 4px; border-radius: 4px; }
        .btn-wa { color: var(--whatsapp); }
        .btn-del { color: var(--danger); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-logout { background: var(--danger); width: auto; padding: 8px 14px; font-size: 0.85rem; }
        .btn-logout:hover { background: #dc2626; }
    </style>
</head>
<body>

    <!-- SCHERMATA DI LOGIN CON GOOGLE -->
    <div id="loginScreen">
        <h2>🔒 Area Riservata</h2>
        <p style="color:var(--subtext); font-size:0.9rem; margin-bottom:20px;">Accedi per sincronizzare le tue stampe 3D</p>
        <button class="btn-google" onclick="loginGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Accedi con Google
        </button>
        <div id="loginError" style="color:var(--danger); font-size:0.85rem; margin-top:15px;"></div>
    </div>

    <!-- APP PRINCIPALE -->
    <div id="appScreen" class="hidden">
        <div class="top-bar">
            <h1>Gestionale Stampe 3D</h1>
            <button class="btn-logout" onclick="logout()">Esci 🚪</button>
        </div>

        <div class="stats">
            <div class="stat-box"><div class="val" id="st-totale">€ 0.00</div><div class="lbl">Incasso Totale</div></div>
            <div class="stat-box"><div class="val" id="st-consegno">€ 0.00</div><div class="lbl">Da Incassare</div></div>
            <div class="stat-box"><div class="val" id="st-profitto">€ 0.00</div><div class="lbl">Profitto Stimato</div></div>
            <div class="stat-box"><div class="val" id="st-count">0</div><div class="lbl">Stampe Totali</div></div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Nuova Stampa</h2>
                <form id="printForm">
                    <div class="form-group">
                        <label>Nome Oggetto</label>
                        <input type="text" id="nome" placeholder="Es. Vaso Parametrico" required>
                    </div>
                    <div class="form-group">
                        <label>Cliente</label>
                        <input type="text" id="cliente" placeholder="Es. Marco Rossi" required>
                    </div>
                    <div class="row-2">
                        <div class="form-group">
                            <label>Prezzo Unit. (€)</label>
                            <input type="number" step="0.50" id="prezzo" placeholder="15.00" required>
                        </div>
                        <div class="form-group">
                            <label>Quantità</label>
                            <input type="number" id="quantita" value="1" min="1" required>
                        </div>
                    </div>
                    <div class="row-2">
                        <div class="form-group">
                            <label>Stato</label>
                            <select id="stato">
                                <option value="Da Stampare">Da Stampare</option>
                                <option value="In Corso">In Corso</option>
                                <option value="Pronto">Pronto</option>
                                <option value="Consegnato">Consegnato</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Materiale</label>
                            <select id="materiale">
                                <option value="PLA">PLA</option>
                                <option value="PETG">PETG</option>
                                <option value="ABS/ASA">ABS/ASA</option>
                                <option value="TPU">TPU</option>
                                <option value="Resina">Resina</option>
                            </select>
                        </div>
                    </div>
                    <div class="row-2">
                        <div class="form-group">
                            <label>Peso cad. (g)</label>
                            <input type="number" id="peso" placeholder="120">
                        </div>
                        <div class="form-group">
                            <label>Tempo Stampa (h)</label>
                            <input type="number" step="0.5" id="oreStampa" placeholder="4.5">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="dataOrdine">
                    </div>
                    <div class="form-group">
                        <label>Note</label>
                        <input type="text" id="note" placeholder="Colore, impostazioni...">
                    </div>
                    <button type="submit">Aggiungi Stampa</button>
                </form>
            </div>

            <div class="card">
                <div class="search-box">
                    <input type="text" id="cercaInput" placeholder="🔍 Cerca oggetto o cliente..." oninput="render()">
                </div>
                <div class="filters">
                    <button class="filter-btn active" onclick="impostaFiltro('Tutti', this)">Tutti</button>
                    <button class="filter-btn" onclick="impostaFiltro('Da Stampare', this)">Da Stampare</button>
                    <button class="filter-btn" onclick="impostaFiltro('In Corso', this)">In Corso</button>
                    <button class="filter-btn" onclick="impostaFiltro('Pronto', this)">Pronti</button>
                    <button class="filter-btn" onclick="impostaFiltro('Consegnato', this)">Consegnati</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Oggetto</th>
                                <th>Cliente</th>
                                <th>Totale</th>
                                <th>Info</th>
                                <th>Stato</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="listaStampe"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBc2Vt0u2WRTSuKNrFOF-hQ7co_5O3PZ1s",
            authDomain: "gestionale-3d.firebaseapp.com",
            databaseURL: "https://gestionale-3d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "gestionale-3d",
            storageBucket: "gestionale-3d.appspot.com",
            messagingSenderId: "459711176944",
            appId: "1:459711176944:web:e43f0aea13ea4d4f00a235"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const stampeRef = db.ref('stampe3d');

        const form = id => document.getElementById(id);
        document.getElementById('dataOrdine').valueAsDate = new Date();
        let filtroStatoAttuale = 'Tutti';

        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                form('loginError').innerText = "Errore durante l'accesso con Google: " + error.message;
            });
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged((user) => {
            if (user) {
                form('loginScreen').classList.add('hidden');
                form('appScreen').classList.remove('hidden');
                caricaDati();
            } else {
                form('loginScreen').classList.remove('hidden');
                form('appScreen').classList.add('hidden');
            }
        });

        let stampe = [];

        function caricaDati() {
            stampeRef.on('value', (snapshot) => {
                const data = snapshot.val();
                stampe = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        stampe.push({ id: key, ...data[key] });
                    });
                    stampe.reverse();
                }
                render();
            });
        }

        form('printForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const qta = parseInt(form('quantita').value) || 1;
            const prezzoUnitario = parseFloat(form('prezzo').value) || 0;
            const pesoCad = parseFloat(form('peso').value) || 0;
            
            // Stima costo materiale (supponendo circa 20€ al kg / 0.02€ al grammo)
            const costoMaterialeStimato = (pesoCad * qta) * 0.02;

            const nuovaStampa = {
                nome: form('nome').value,
                cliente: form('cliente').value,
                prezzoTotale: prezzoUnitario * qta,
                quantita: qta,
                stato: form('stato').value,
                peso: pesoCad ? pesoCad + 'g' : '-',
                materiale: form('materiale').value,
                oreStampa: form('oreStampa').value ? form('oreStampa').value + 'h' : '-',
                costoMateriale: costoMaterialeStimato,
                data: form('dataOrdine').value || '-',
                note: form('note').value
            };
            stampeRef.push(nuovaStampa);
            form('printForm').reset();
            form('quantita').value = '1';
            form('dataOrdine').valueAsDate = new Date();
        });

        function cancella(id) {
            if(confirm('Vuoi eliminare questa stampa?')) {
                db.ref('stampe3d/' + id).remove();
            }
        }

        function cambiaStato(id, nuovoStato) {
            db.ref('stampe3d/' + id).update({ stato: nuovoStato });
        }

        function impostaFiltro(stato, btn) {
            filtroStatoAttuale = stato;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function inviaWhatsApp(nome, cliente, prezzo, stato) {
            const testo = `Ciao ${cliente}! Ti aggiorno sul tuo ordine di stampa 3D ("${nome}"). Stato attuale: *${stato}*. Totale: € ${prezzo.toFixed(2)}. Grazie!`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(testo)}`;
            window.open(url, '_blank');
        }

        function render() {
            const tbody = form('listaStampe');
            tbody.innerHTML = '';
            
            const filtroTesto = form('cercaInput').value.toLowerCase();
            let totaleIncasso = 0;
            let daIncassare = 0;
            let totaleCosti = 0;
            let countTotali = 0;

            stampe.forEach(s => {
                const nomeOggetto = (s.nome || '').toLowerCase();
                const nomeCliente = (s.cliente || '').toLowerCase();

                // Filtri ricerca e stato
                if (filtroTesto && !nomeOggetto.includes(filtroTesto) && !nomeCliente.includes(filtroTesto)) return;
                if (filtroStatoAttuale !== 'Tutti' && s.stato !== filtroStatoAttuale) return;

                const prezzo = s.prezzoTotale || 0;
                const costoMat = s.costoMateriale || 0;
                totaleIncasso += prezzo;
                totaleCosti += costoMat;
                if(s.stato !== 'Consegnato') daIncassare += prezzo;
                countTotali++;

                const qtaBadge = s.quantita > 1 ? ` <span style="background:var(--accent); padding:1px 5px; border-radius:4px; font-size:0.7rem;">x${s.quantita}</span>` : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${s.nome}</strong>${qtaBadge}<br><small style="color:var(--subtext)">${s.data}</small></td>
                    <td>${s.cliente}</td>
                    <td><strong>€ ${prezzo.toFixed(2)}</strong></td>
                    <td><small>${s.materiale} (${s.peso})<br>⏱️ ${s.oreStampa}</small></td>
                    <td>
                        <select onchange="cambiaStato('${s.id}', this.value)" style="padding:4px; font-size:0.8rem;">
                            <option value="Da Stampare" ${s.stato==='Da Stampare'?'selected':''}>Da Stampare</option>
                            <option value="In Corso" ${s.stato==='In Corso'?'selected':''}>In Corso</option>
                            <option value="Pronto" ${s.stato==='Pronto'?'selected':''}>Pronto</option>
                            <option value="Consegnato" ${s.stato==='Consegnato'?'selected':''}>Consegnato</option>
                        </select>
                    </td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn-action btn-wa" title="Invia promemoria WhatsApp" onclick="inviaWhatsApp('${s.nome}', '${s.cliente}', ${prezzo}, '${s.stato}')">💬</button>
                            <button class="btn-action btn-del" title="Elimina" onclick="cancella('${s.id}')">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            form('st-totale').innerText = `€ ${totaleIncasso.toFixed(2)}`;
            form('st-consegno').innerText = `€ ${daIncassare.toFixed(2)}`;
            form('st-profitto').innerText = `€ ${(totaleIncasso - totaleCosti).toFixed(2)}`;
            form('st-count').innerText = countTotali;
        }
    </script>
</body>
</html>
